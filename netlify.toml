[build]
  command = "npm run build"
  publish = "dist"

# Routing lives in dist/_redirects, which scripts/prerender.js generates: each prerendered route
# is served with 200, and every other path gets 404.html with a real 404 status.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
